services:
  indexer:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["/app/indexer"]
    restart: always
    env_file:
      - .env

  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["/app/api"]
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    restart: always
    env_file:
      - .env
